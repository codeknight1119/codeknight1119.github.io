<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Worldbuilding Timeline V3</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="https://unpkg.com/rpg-awesome@1.2.0/css/rpg-awesome.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    :root {
      --bg-color: #111319;
      --card-bg: #1c202b;
      --accent-color: #d4a359;
      --text-main: #e0e6ed;
      --text-muted: #8b9bb4;
      --border-color: #2a3142;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Cinzel', 'Georgia', serif;
      background: var(--bg-color);
      color: var(--text-main);
      overflow-x: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
    }

    /* Controls Bar */
    header {
      padding: 1rem 2rem;
      background: #161922;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      gap: 1.5rem;
      align-items: center;
      z-index: 10;
      flex-wrap: wrap;
    }

    .nav-btn {
      background: #222736;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 0.5rem 1rem;
      border-radius: 4px;
      cursor: pointer;
    }

    .nav-btn:hover { border-color: var(--accent-color); }
    
    .zoom-control {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-left: auto;
    }

    /* Timeline Workspace */
    .timeline-container {
      flex: 1;
      overflow-x: auto;
      overflow-y: hidden;
      position: relative;
      cursor: grab;
      white-space: nowrap; /* Keeps items flowing horizontally */
      padding-bottom: 20px; /* Extra padding for scrollbar clearance */
    }
    
    .timeline-container:active {
      cursor: grabbing;
    }

    .timeline-track-wrapper {
      position: relative;
      display: inline-block;
      height: 100%;
      min-width: 100%;
      min-height: 500px;
    }

    /* Bottom Axis (Shifted Up) */
    .axis-container {
      position: absolute;
      bottom: 50px; /* Shifted up from 20px */
      left: 0;
      height: 40px;
      display: flex;
      border-top: 2px solid var(--accent-color);
    }

    .era-segment {
      position: relative;
      height: 100%;
      display: inline-flex;
      border-right: 2px solid rgba(255,255,255,0.1);
      /* Text removed to prevent overlap, just keeping the background color blocks */
    }

    .year-tick {
      position: absolute;
      bottom: 50px; /* Aligned with axis-container */
      width: 1px;
      height: 10px;
      background: var(--border-color);
    }

    .year-label {
      position: absolute;
      bottom: 65px;
      transform: translateX(-50%);
      font-size: 0.75rem;
      color: var(--text-muted);
      font-family: sans-serif;
    }

    /* Events Layer */
    .minor-event-marker {
      position: absolute;
      bottom: 100px; /* Shifted up to clear labels */
      transform: translateX(-50%);
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 0.85rem;
      cursor: pointer;
      z-index: 5;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .minor-event-marker i { 
      color: var(--accent-color);
      font-size: 1.2rem; /* Force icon sizing in case CDN defaults fail */
    }

    /* Triangle Pointer */
    .minor-event-marker::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 50%;
      margin-left: -6px;
      border-width: 6px;
      border-style: solid;
      border-color: var(--card-bg) transparent transparent transparent;
    }

    .minor-event-marker::before {
      content: '';
      position: absolute;
      top: 100%;
      left: 50%;
      margin-left: -7px;
      border-width: 7px;
      border-style: solid;
      border-color: var(--border-color) transparent transparent transparent;
      z-index: -1;
    }

    .minor-event-marker:hover, .minor-event-marker.selected {
      border-color: var(--accent-color);
      transform: translateX(-50%) translateY(-3px);
      z-index: 20;
    }
    .minor-event-marker:hover::before, .minor-event-marker.selected::before {
      border-color: var(--accent-color) transparent transparent transparent;
    }

    /* Stories Layer */
    .story-card {
      position: absolute;
      bottom: 160px; /* Shifted up to float above events */
      height: auto; /* Changed to auto for wrapping */
      min-height: 80px;
      background: rgba(28, 32, 43, 0.9);
      border: 1px solid var(--accent-color);
      border-radius: 6px;
      padding: 10px 14px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      z-index: 10;
      backdrop-filter: blur(4px);
      
      /* Force text wrapping */
      white-space: normal; 
      word-wrap: break-word;
    }

    .story-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 4px 15px rgba(212, 163, 89, 0.3);
      border-color: #fff;
      z-index: 25;
    }

    /* Sliding Drawer */
    .drawer {
      position: fixed;
      top: 0;
      right: -40%;
      width: 38%;
      height: 100%;
      background: #161923;
      border-left: 2px solid var(--accent-color);
      box-shadow: -5px 0 25px rgba(0,0,0,0.8);
      transition: right 0.3s ease-in-out;
      z-index: 100;
      padding: 2rem;
      overflow-y: auto;
    }

    .drawer.open { right: 0; }
    .close-btn {
      float: right;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.5rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <div class="era-nav">
      <button class="nav-btn" onclick="scrollToEra('ET')">ET</button>
      <button class="nav-btn" onclick="scrollToEra('CR')">CR</button>
      <button class="nav-btn" onclick="scrollToEra('NET')">NET</button>
    </div>
    
    <div class="zoom-control">
      <label for="zoomSlider"><i class="fa-solid fa-magnifying-glass"></i> Zoom:</label>
      <input type="range" id="zoomSlider" min="1" max="20" value="4" oninput="handleZoom(this.value)">
    </div>
  </header>

  <div class="timeline-container" id="timelineContainer">
    <div class="timeline-track-wrapper" id="trackWrapper">
      </div>
  </div>

  <div class="drawer" id="detailDrawer">
    <button class="close-btn" onclick="closeDrawer()">&times;</button>
    <div id="drawerContent"></div>
  </div>

  <script>
    // 1. CONFIGURATION & DATA
    const ERAS = {
      ET:  { name: "Edenic Times",     start: 0, end: 300,  color: "#2a4d38" },
      CR:  { name: "Chaotic Rule",     start: 0, end: 2000, color: "#5c2828" },
      NET: { name: "New Edenic Times", start: 0, end: 300,  color: "#244063" }
    };

    let ZOOM_PX_PER_YEAR = 4;

    const STORIES = [
      { id: "s1", title: "Dawn of the First Sanctuary", era: "ET", startYear: 20, endYear: 140, description: "Creation of the first magic enclave." },
      { id: "s2", title: "The Shattered Crown which triggered the long dark era of mankind", era: "CR", startYear: 400, endYear: 850, description: "A centuries-long war. Notice how this long title now wraps properly within the card." },
      { id: "s3", title: "Rebirth of the Core", era: "NET", startYear: 10, endYear: 50, description: "The rebuilding phase." }
    ];

    const EVENTS = [
      { id: "e1", title: "Fall of the Elder Tree", era: "ET", year: 300, icon: "ra-tree", description: "Marks the end of ET." },
      { id: "e2", title: "Rise of the Warlord", era: "CR", year: 120, icon: "ra-crossed-swords", description: "First uprising." },
      { id: "e3", title: "Treaty of Ash", era: "CR", year: 850, icon: "ra-scroll-unfurled", description: "The war officially ends." }
    ];

    // 2. HELPER FUNCTIONS
    function getAbsoluteYearOffset(eraKey, year) {
      let offset = 0;
      if (eraKey === "CR") offset = ERAS.ET.end;
      if (eraKey === "NET") offset = ERAS.ET.end + ERAS.CR.end;
      return (offset + year) * ZOOM_PX_PER_YEAR;
    }

    // 3. RENDER ENGINE
    function renderTimeline() {
      const wrapper = document.getElementById("trackWrapper");
      wrapper.innerHTML = ""; 

      const axisContainer = document.createElement("div");
      axisContainer.className = "axis-container";
      
      let tickInterval = 10;
      if (ZOOM_PX_PER_YEAR < 2) tickInterval = 100;
      else if (ZOOM_PX_PER_YEAR < 5) tickInterval = 50;

      Object.keys(ERAS).forEach(key => {
        const era = ERAS[key];
        const widthPx = (era.end - era.start) * ZOOM_PX_PER_YEAR;
        
        const seg = document.createElement("div");
        seg.className = "era-segment";
        seg.style.width = `${widthPx}px`;
        seg.style.backgroundColor = era.color;
        seg.id = `era-block-${key}`;
        axisContainer.appendChild(seg);

        for(let y = 0; y <= era.end; y += tickInterval) {
          const absPx = getAbsoluteYearOffset(key, y);
          
          const tick = document.createElement("div");
          tick.className = "year-tick";
          tick.style.left = `${absPx}px`;
          wrapper.appendChild(tick);

          const label = document.createElement("div");
          label.className = "year-label";
          label.style.left = `${absPx}px`;
          label.innerText = `${y} ${key}`;
          wrapper.appendChild(label);
        }
      });
      wrapper.appendChild(axisContainer);

      EVENTS.forEach(event => {
        const posPx = getAbsoluteYearOffset(event.era, event.year);
        const marker = document.createElement("div");
        marker.className = "minor-event-marker";
        marker.style.left = `${posPx}px`;
        marker.innerHTML = `<i class="ra ${event.icon}"></i> <span>${event.title}</span>`;
        marker.onclick = () => openDrawer(event);
        wrapper.appendChild(marker);
      });

      STORIES.forEach(story => {
        const startPx = getAbsoluteYearOffset(story.era, story.startYear);
        const duration = Math.max(story.endYear - story.startYear, 2); 
        const widthPx = duration * ZOOM_PX_PER_YEAR;

        const card = document.createElement("div");
        card.className = "story-card";
        card.style.left = `${startPx}px`;
        card.style.width = `${Math.max(widthPx, 200)}px`; // Bumped minimum width to accommodate wrapping cleanly
        card.innerHTML = `<strong style="display:block; margin-bottom: 4px;">${story.title}</strong><small style="color: var(--text-muted)">${story.era} ${story.startYear} - ${story.endYear}</small>`;
        card.onclick = () => openDrawer(story);
        wrapper.appendChild(card);
      });
    }

    // 4. INTERACTIONS
    function handleZoom(value) {
      ZOOM_PX_PER_YEAR = parseFloat(value);
      renderTimeline();
    }

    function openDrawer(item) {
      const drawer = document.getElementById("detailDrawer");
      const content = document.getElementById("drawerContent");
      const markdownBody = item.description ? marked.parse(item.description) : "";
      
      content.innerHTML = `
        <h2>${item.title}</h2>
        <p style="color: var(--accent-color); margin-bottom: 1rem;">
          ${item.era} ${item.startYear !== undefined ? `${item.startYear} – ${item.endYear}` : `Year ${item.year}`}
        </p>
        <hr style="border-color: var(--border-color); margin-bottom: 1rem;">
        <div>${markdownBody}</div>
      `;
      drawer.classList.add("open");
    }

    function closeDrawer() { document.getElementById("detailDrawer").classList.remove("open"); }

    function scrollToEra(eraKey) {
      const eraElement = document.getElementById(`era-block-${eraKey}`);
      if (eraElement) {
        const container = document.getElementById("timelineContainer");
        container.scrollTo({ left: eraElement.offsetLeft, behavior: 'smooth' });
      }
    }

    // Drag to scroll logic
    const slider = document.getElementById('timelineContainer');
    let isDown = false;
    let startX;
    let scrollLeft;

    slider.addEventListener('mousedown', (e) => {
      isDown = true;
      startX = e.pageX - slider.offsetLeft;
      scrollLeft = slider.scrollLeft;
    });
    slider.addEventListener('mouseleave', () => { isDown = false; });
    slider.addEventListener('mouseup', () => { isDown = false; });
    slider.addEventListener('mousemove', (e) => {
      if (!isDown) return;
      e.preventDefault();
      const x = e.pageX - slider.offsetLeft;
      const walk = (x - startX) * 1.5; 
      slider.scrollLeft = scrollLeft - walk;
    });

    window.onload = renderTimeline;
  </script>
</body>
</html>
