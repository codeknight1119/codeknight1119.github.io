<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Tavern - Login</title>
    <link rel="stylesheet" href="./main/style.css" />
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-align: center;
            overflow: hidden; 
        }

        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 15px;
        }

        h1 {
            font-size: 2.5em; 
            padding: 10px;
            margin: 0;
        }

        #newSignInPopup {
            width: 90%;
            max-width: 400px;
            border: 1px solid var(--line-clr, #ccc);
            border-radius: 5px;
            background: var(--base-clr, #fff);
            display: flex;
            flex-direction: column;
            padding: 20px;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1000;
        }

        #newSignInPopup input {
            margin: 5px 0;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
    </style>
</head>

<body>
    <div id="newSignInPopup" hidden>
        <h3>Register for The Tavern</h3>
        <input id="newSignInPopup_FirstName" placeholder="First Name">
        <input id="newSignInPopup_LastName" placeholder="Last Name">
        <input id="newSignInPopup_StudentId" placeholder="Student Id">
        <input id="newSignInPopup_UserName" placeholder="Username (This can be changed later)">
        <button id="signUp">Signup</button>
    </div>

    <div class="container">
        <header>
            <h1>The Tavern Login</h1>
        </header>

        <main class="paper container">
            <div id="loginSignUp">
                <p>The WCHS D&D club hub is just a click away! Sign in and get verified by an Officer to join the fun!</p>
                <br>
                <button id="login">Login/Sign Up</button>
            </div>
            <div id="getVerified" hidden>
                <p>You are signed in but not verified, please tell an Officer to let you into the club!</p>
            </div>
        </main>
    </div>

    <script type="module">
        import {FirebaseUtils} from "./firebaseUtils.js"

        const loginSignUpEl = document.getElementById("loginSignUp")
        const getVerifiedEl = document.getElementById("getVerified")
        const signUpEl = document.getElementById("newSignInPopup")

        let userData = null
        async function handleLogin(data, auto = true){
             userData = await FirebaseUtils.getDocument(`/users/${data.uid}`)
            if(data.isNew || userData === undefined){
                if(auto){
                    signUpEl.hidden = false;
                }
            }else{
                const tokens = await data.getIdTokenResult(true);
                const perms = Object.keys(tokens.claims)
                console.log(perms) 
                if(perms.includes("allowed")){
                    goToMainSite()
                }else{
                    signUpEl.hidden = true;
                    getVerifiedEl.hidden = false;
                }
            }
        }

        async function checkLogin() {
            const data = await FirebaseUtils.isSignedIn()
            await handleLogin(data, false)
        }
        checkLogin()

        document.getElementById("login").addEventListener("click", async () => {
            const signIn = await FirebaseUtils.loginGoogle()
            await handleLogin(signIn)
        })

        document.getElementById("signUp").addEventListener("click", async () => {
            const firstName = document.getElementById("newSignInPopup_FirstName").value.trim()
            const lastName = document.getElementById("newSignInPopup_LastName").value.trim()
            const displayName = document.getElementById("newSignInPopup_UserName").value.trim()
            const studentID = document.getElementById("newSignInPopup_StudentId").value.trim()
            FirebaseUtils.setDocument(`/users/${userData.uid}`, {
                realName : `${firstName} ${lastName}`,
                realFirstName: firstName,
                realLastName: lastName,
                displayName: displayName,
                studentID: studentID,
                permissions: ["player"]
            })
            signUpEl.hidden = true;
            getVerifiedEl.hidden = false;
        })

    </script>
</body>

</html>
